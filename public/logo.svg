<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Yo Mama Jokes Central">
  <defs>
    <linearGradient id="ymjNeon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d78"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <radialGradient id="ymjGlow" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#ff2d78" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ff2d78" stop-opacity="0"/>
    </radialGradient>
    <filter id="ymjBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Dark neon tile -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="#16131f"/>
  <rect x="8" y="8" width="496" height="496" rx="110" fill="url(#ymjGlow)"/>
  <rect x="13" y="13" width="486" height="486" rx="104" fill="none" stroke="url(#ymjNeon)" stroke-width="9"/>

  <!-- Condensed bold caps; Anton-like stack with widely available fallbacks
       so it stays on-brand even when rendered as an isolated <img>. -->
  <g font-family="Anton, Oswald, Impact, Haettenschweiler, 'Arial Narrow', system-ui, sans-serif" text-anchor="middle">
    <!-- soft neon glow behind the wordmark -->
    <g filter="url(#ymjBlur)" opacity="0.85">
      <text x="256" y="212" font-size="160" font-weight="700" fill="#ff2d78">YO</text>
      <text x="256" y="352" font-size="150" font-weight="700" fill="#00e5ff">MAMA</text>
    </g>
    <text x="256" y="212" font-size="160" font-weight="700" fill="#ffffff">YO</text>
    <text x="256" y="352" font-size="150" font-weight="700" fill="url(#ymjNeon)">MAMA</text>
    <text x="256" y="446" font-size="60" font-weight="700" fill="#00e5ff" letter-spacing="10">JOKES</text>
  </g>
</svg>
