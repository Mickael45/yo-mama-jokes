name: Daily rebuild

# Rebuilds + deploys the static site once a day so the date-seeded "joke of the
# day" picker rotates and the "/" sitemap lastmod advances. Without a scheduled
# deploy, build-time freshness is frozen until the next push (MASTER §5/§14).
on:
  schedule:
    - cron: "10 5 * * *" # 05:10 UTC daily
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
