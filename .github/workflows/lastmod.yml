name: Refresh sitemap lastmod manifest

# The production build env clones shallow, so per-page dates are precomputed
# here from full history and committed as lastmod.json (read by scripts/lastmod.mjs).
# Triggered by content changes only — lastmod.json itself is not a trigger path,
# so the refresh commit cannot loop. The comedy-bot commits with a PAT, which
# (unlike GITHUB_TOKEN commits) does fire this push event.
on:
  push:
    branches: [main]
    paths:
      - "jokes/**"
      - "src/pages/**"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MINIMAL_GITHUB_PAT }}

      - name: Regenerate lastmod.json from git history
        run: node scripts/gen-lastmod.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet lastmod.json; then
            echo "lastmod.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lastmod.json
          git commit -m "chore: refresh sitemap lastmod manifest"
          git push
